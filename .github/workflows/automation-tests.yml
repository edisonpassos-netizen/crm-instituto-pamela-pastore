name: Automation worker and database integration tests
on:
  push:
    branches: [main, feature/automation-engine, integration/automation-safe-20261015]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://dxfzuxybubvnjertiowf.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check worker and API syntax
        run: node --check netlify/functions/automation-worker.mjs && node --check netlify/functions/lib/automation-event-adapter.mjs && node --check netlify/functions/lib/automation-enqueue.mjs && node --check netlify/functions/lib/customer-experience.mjs && node --check netlify/functions/lib/whatsapp-outbound-config.mjs && node --check netlify/functions/crm-state.mjs && node --check netlify/functions/whatsapp-status-webhook.mjs
      - name: Run automation unit, lifecycle, experience and operator page tests
        run: node --test tests/automation-worker.test.mjs tests/automation-lifecycle.test.mjs tests/automation-event-adapter.test.mjs tests/automation-crm-integration.test.mjs tests/customer-experience.test.mjs tests/satisfaction-quick-replies.test.mjs tests/whatsapp-missing-message-id.test.mjs tests/whatsapp-api-mock.test.mjs tests/whatsapp-status-webhook.test.mjs tests/automation-operator-queue.test.mjs tests/followups-page.test.mjs tests/attendances-page.test.mjs tests/automation-schedule.test.mjs

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: automation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d automation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: automation_test
    steps:
      - uses: actions/checkout@v4
      - name: Create test-only Supabase roles
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/automation-test-roles.sql
      - name: Apply CRM state foundation
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610090001_create_crm_app_state.sql
      - name: Apply proposed migration to ephemeral PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610120001_automation_engine.sql
      - name: Test deduplication, atomic claim, stale lock recovery, and closed public access
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/automation-integration.sql
      - name: Apply proposed ambiguous-delivery migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610120002_delivery_unknown.sql
      - name: Apply proposed WhatsApp provider-status migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610120003_whatsapp_status.sql
      - name: Apply proposed privilege hardening migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610120004_harden_automation_privileges.sql
      - name: Verify least-privilege grants and default ACLs
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/automation-privilege-hardening.sql
      - name: Apply operator follow-up queue state migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610130005_followup_awaiting_operator.sql
      - name: Apply atomic manual queue resolution migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610130006_atomic_manual_queue_resolution.sql
      - name: Test manual resolution state, audit trail, conflicts, and grants
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/manual-queue-resolution.sql
      - name: Apply customer experience workflow migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160001_customer_experience_flow.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160002_customer_experience_send_completion.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160003_preproduction_audit_hardening.sql
      - name: Test satisfaction, recovery, delayed review and idempotency
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/customer-experience-flow.sql
      - name: Test pre-production audit hardening
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/preproduction-audit-hardening.sql
      - name: Apply main CRM atomic follow-up trigger
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160004_atomic_main_followup_enqueue.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160005_followup_source_integrity.sql
      - name: Test main CRM follow-up trigger
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/main-crm-followup-trigger.sql
      - name: Apply Supabase advisor hardening
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160006_supabase_advisor_hardening.sql
      - name: Test Supabase advisor hardening
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/supabase-advisor-hardening.sql

name: Automation worker and database integration tests
on:
  push:
    branches: [feature/automation-engine]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check worker syntax
        run: node --check netlify/functions/automation-worker.mjs && node --check netlify/functions/lib/automation-event-adapter.mjs
      - name: Run automation unit and lifecycle tests
        run: node --test tests/automation-worker.test.mjs tests/automation-lifecycle.test.mjs tests/automation-event-adapter.test.mjs tests/whatsapp-api-mock.test.mjs

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: automation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d automation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: automation_test
    steps:
      - uses: actions/checkout@v4
      - name: Create test-only Supabase roles
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/automation-test-roles.sql
      - name: Apply proposed migration to ephemeral PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610100001_automation_engine.sql
      - name: Test deduplication, atomic claim, stale lock recovery, and closed public access
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/automation-integration.sql
      - name: Apply proposed ambiguous-delivery migration to ephemeral PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610100002_delivery_unknown.sql

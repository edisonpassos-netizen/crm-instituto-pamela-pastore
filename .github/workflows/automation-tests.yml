name: Automation worker and database integration tests
on:
  push:
    branches: [main, feature/automation-engine, integration/automation-safe-20261015]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://dxfzuxybubvnjertiowf.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check worker and API syntax
        run: node --check netlify/functions/automation-worker.mjs && node --check netlify/functions/lib/automation-event-adapter.mjs && node --check netlify/functions/lib/automation-enqueue.mjs && node --check netlify/functions/lib/customer-experience.mjs && node --check netlify/functions/lib/followup-schedule.mjs && node --check netlify/functions/lib/whatsapp-outbound-config.mjs && node --check netlify/functions/crm-state.mjs && node --check netlify/functions/whatsapp-status-webhook.mjs
      - name: Run automation unit, lifecycle, experience and operator page tests
        run: node --test tests/*.test.mjs

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: automation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d automation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: automation_test
    steps:
      - uses: actions/checkout@v4
      - name: Create test-only Supabase roles
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/automation-test-roles.sql
      - name: Apply CRM state foundation
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610090001_create_crm_app_state.sql
      - name: Apply proposed migration to ephemeral PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610120001_automation_engine.sql
      - name: Test deduplication, atomic claim, stale lock recovery, and closed public access
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/automation-integration.sql
      - name: Apply proposed ambiguous-delivery migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610120002_delivery_unknown.sql
      - name: Apply proposed WhatsApp provider-status migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610120003_whatsapp_status.sql
      - name: Apply proposed privilege hardening migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610120004_harden_automation_privileges.sql
      - name: Verify least-privilege grants and default ACLs
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/automation-privilege-hardening.sql
      - name: Apply operator follow-up queue state migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610130005_followup_awaiting_operator.sql
      - name: Apply atomic manual queue resolution migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610130006_atomic_manual_queue_resolution.sql
      - name: Test manual resolution state, audit trail, conflicts, and grants
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/manual-queue-resolution.sql
      - name: Apply existing inbound and manual task synchronization migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610150004_whatsapp_inbound_messages.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015193500_manual_result_task_sync.sql
      - name: Apply customer experience workflow migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160001_customer_experience_flow.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160002_customer_experience_send_completion.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160003_preproduction_audit_hardening.sql
      - name: Test satisfaction, recovery, delayed review and idempotency
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/customer-experience-flow.sql
      - name: Test pre-production audit hardening
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/preproduction-audit-hardening.sql
      - name: Apply main CRM atomic follow-up trigger
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160004_atomic_main_followup_enqueue.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160005_followup_source_integrity.sql
      - name: Test main CRM follow-up trigger
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/main-crm-followup-trigger.sql
      - name: Apply Supabase advisor hardening
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160006_supabase_advisor_hardening.sql
      - name: Test Supabase advisor hardening
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/supabase-advisor-hardening.sql
      - name: Apply follow-up time support
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160007_followup_time_support.sql
      - name: Test follow-up time support
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/followup-time-support.sql
      - name: Apply internal-only worker claim
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610150001_claim_internal_automation_jobs.sql
      - name: Verify internal worker cannot claim WhatsApp or Google review jobs
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/internal-claim-isolation.sql

      - name: Apply first response protection
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017204238_first_customer_experience_response.sql
      - name: Test first response protection and survey correlation
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/first-experience-response.sql

      - name: Apply atomic inbound lead capture
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023144838_atomic_whatsapp_lead_capture.sql
      - name: Verify lead creation, idempotency and closed public access
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-lead-capture.sql
      - name: Test independent concurrent claims and expired lock recovery
        run: node tests/e2e/claim-concurrency.mjs
      - name: Export and compare effective schema definitions
        run: |
          psql -X -t -A -v ON_ERROR_STOP=1 -f tests/sql/schema-manifest.sql > /tmp/crm-ephemeral-schema.json
          node tests/e2e/schema-compare.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned test-only browser dependency
        run: |
          npm install --prefix /tmp/crm-qa --ignore-scripts playwright@1.62.1
          /tmp/crm-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Reset disposable fixtures after SQL regression suites
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/e2e-fixtures.sql
      - name: Start isolated PostgREST and application
        run: |
          docker run -d --name crm-e2e-rest --network host -e PGRST_DB_URI=postgres://postgres:test-only-password@127.0.0.1:5432/automation_test -e PGRST_DB_ANON_ROLE=anon -e PGRST_DB_SCHEMAS=public -e PGRST_JWT_SECRET=ephemeral-jwt-signing-key-for-crm-e2e-only postgrest/postgrest:v12.2.3
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:3000/ > /dev/null && break; sleep 1; done
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/crm-e2e-key.pem -out /tmp/crm-e2e-cert.pem -days 1 -subj /CN=localhost
          node tests/e2e/server.mjs > /tmp/crm-e2e-server.log 2>&1 &
          for attempt in $(seq 1 20); do curl --insecure --fail --silent https://localhost:8443/ > /dev/null && break; sleep 1; done
      - name: Run browser to real backend to PostgreSQL 17 tests
        run: node tests/e2e/browser.mjs
      - name: Upload isolated schema and application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-isolated-e2e-diagnostics
          path: |
            /tmp/crm-schema-diff.json
            /tmp/crm-ephemeral-schema.json
            /tmp/crm-e2e-server.log

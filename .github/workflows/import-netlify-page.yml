name: Import current Netlify CRM page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download currently published CRM interface
        run: curl --fail --location --silent --show-error "https://peppy-salamander-2d8776.netlify.app/" --output index.html
      - name: Commit current interface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes in currently published page."
          else
            git commit -m "Import current Netlify CRM interface"
            git push
          fi

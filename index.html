<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Comercial — Studio Pâmela Pastore</title>
<style>
:root{
 --primary:#1A8690;--primary-dark:#126B73;--primary-light:#55AAB1;
 --bg:#f4f7f7;--surface:#fff;--line:#dfe7e8;--text:#263238;--muted:#68777a;
 --success:#2e8b57;--warning:#d99518;--danger:#c94b4b;--shadow:0 8px 28px rgba(25,65,70,.08);
}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
.side{background:var(--primary);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{text-align:center;padding:8px 4px 18px;border-bottom:1px solid rgba(255,255,255,.2)}
.brand img{width:180px;max-width:100%;border-radius:10px;display:block;margin:auto;background:#fff}
.brand small{display:block;margin-top:10px;opacity:.9;line-height:1.35}
.nav{margin-top:15px;display:grid;gap:6px}.nav button{border:0;background:transparent;color:#fff;text-align:left;padding:11px 12px;border-radius:9px;font-weight:600}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.15)}
.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}
.top h1{font-size:20px;margin:0}.status{font-size:12px;color:var(--success);background:#eef8f2;padding:7px 10px;border-radius:20px}
.content{padding:24px;max-width:1500px;margin:auto}
.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(5,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow)}
.card .label{font-size:12px;color:var(--muted)}.card .value{font-size:27px;font-weight:800;margin-top:7px}
.section{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow);margin-top:16px}
.section h2{font-size:16px;margin:0 0 14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 12px;border-radius:9px;font-weight:650}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.primary:hover{background:var(--primary-dark)}
.btn.danger{color:#a93636}.btn.success{color:#247548}.btn.small{padding:6px 8px;font-size:12px}
input,select,textarea{width:100%;border:1px solid #cfdadb;border-radius:8px;padding:9px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,134,144,.1)}
label{font-size:12px;font-weight:700;color:#536164;display:block;margin-bottom:5px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.full{grid-column:1/-1}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-size:11px;text-transform:uppercase}
.badge{display:inline-flex;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:800;background:#eef3f3;color:#456}
.b-hot{background:#fff1e4;color:#a65a12}.b-warm{background:#fff7dc;color:#946d09}.b-cold{background:#edf3ff;color:#3865a6}
.b-success{background:#eaf7ef;color:#287347}.b-danger{background:#ffeded;color:#a13c3c}
.pipeline{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:10px;overflow:auto;padding-bottom:6px}
.column{background:#f7f9f9;border:1px solid var(--line);border-radius:11px;padding:10px;min-height:250px}.column h3{font-size:12px;margin:0 0 8px}
.lead-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;box-shadow:0 3px 10px rgba(0,0,0,.04)}
.lead-card strong{display:block;margin-bottom:5px}.lead-card small{color:var(--muted)}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.empty{color:var(--muted);padding:25px;text-align:center}
.modal-back{position:fixed;inset:0;background:rgba(16,40,42,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal{background:#fff;border-radius:14px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.modal-head h2{margin:0;font-size:18px}
.toast{position:fixed;right:22px;bottom:22px;background:#263238;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:30}
.kpi-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.bars{display:grid;gap:9px}.bar-row{display:grid;grid-template-columns:150px 1fr 45px;gap:8px;align-items:center;font-size:12px}.bar{height:9px;background:#e8eeee;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary);border-radius:20px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button{padding:12px;border:1px solid var(--line);background:#fff;border-radius:10px;text-align:left}.quick b{display:block;margin-bottom:4px}.muted{color:var(--muted)}
.auth-gate{position:fixed;inset:0;z-index:1000;background:rgba(244,247,247,.98);display:none;align-items:center;justify-content:center;padding:20px}.auth-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}.auth-card h2{margin:0 0 8px}.auth-card p{color:var(--muted);line-height:1.5}.auth-card form{display:grid;gap:12px}.auth-error{color:var(--danger);font-size:13px;min-height:18px}
@media(max-width:1050px){.app{grid-template-columns:78px 1fr}.brand img{width:50px}.brand small{display:none}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:20px}.cards{grid-template-columns:repeat(3,1fr)}.pipeline{grid-template-columns:repeat(4,230px)}}
@media(max-width:700px){.app{display:block}.side{height:auto;position:relative}.brand{display:flex;align-items:center;gap:10px}.brand img{width:90px}.brand small{display:block;text-align:left}.nav{display:flex;overflow:auto}.nav button{font-size:12px;white-space:nowrap}.top{position:relative}.content{padding:12px}.cards,.form,.kpi-grid,.quick{grid-template-columns:1fr 1fr}}
</style>
</head>

const APP="studio_pamela_crm_v1";
const API_URL="/.netlify/functions/crm-state";
let cloudRevision=null;
let cloudAvailable=false;
let cloudWarning="";
let saveQueue=Promise.resolve();
const stages=["Novo lead","Primeiro contato","Respondeu","Qualificado","Interessado","Oferta","Agendado","Confirmado","Compareceu","Venda realizada","Pós-venda","Recuperação","Perdido"];
const services=["Pilates","Fisioterapia particular","Fisioterapia convênio","Estética facial","Estética corporal","Depilação a laser","Acupuntura","Ozonioterapia","Avaliação","Outro"];
const sources=["Instagram","Facebook","WhatsApp","Google","Google Ads","Meta Ads","Indicação","Orgânico","Site","Landing Page","Presencial","Outro"];
let state={id:"state",page:"dashboard", leads:[], tasks:[], sales:[], settings:{studioName:"Studio Pâmela Pastore",primary:"#1A8690"}};
let db;

function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2)}
function today(){return new Date().toISOString().slice(0,10)}
function money(n){return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){const e=document.getElementById("toast");e.textContent=cloudWarning?cloudWarning:s;e.style.display="block";setTimeout(()=>e.style.display="none",cloudWarning?5200:2200)}
function wa(phone){let p=String(phone||"").replace(/\D/g,"");if(p.length===10||p.length===11)p="55"+p; if(!p){toast("Telefone não informado");return} window.open("https://wa.me/"+p,"_blank")}
function setDbStatus(text,kind="ok"){
 const el=document.getElementById("dbStatus"); if(!el)return;
 el.textContent=(kind==="ok"?"● ":kind==="warn"?"⚠ ":"● ")+text;
 el.style.background=kind==="ok"?"#eef8f2":kind==="warn"?"#fff5df":"#ffeded";
 el.style.color=kind==="ok"?"#247548":kind==="warn"?"#8a5a00":"#a13c3c";
}
function saveLocalCache(snapshot){return new Promise((resolve,reject)=>{if(!db)return resolve();const tx=db.transaction("store","readwrite");tx.objectStore("store").put({...snapshot,id:"state"});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function loadLocalCache(){return new Promise((resolve,reject)=>{const tx=db.transaction("store","readonly");const r=tx.objectStore("store").get("state");r.onsuccess=()=>{if(r.result)state={...r.result,id:"state"};resolve(Boolean(r.result))};r.onerror=()=>reject(r.error)})}
async function requestCloud(method="GET",payload=null){
 const options={method,credentials:"same-origin",headers:{"Accept":"application/json"}};
 if(payload){options.headers["Content-Type"]="application/json";options.body=JSON.stringify(payload)}
 const response=await fetch(API_URL,options);
 const result=await response.json().catch(()=>({error:"Resposta inválida do servidor"}));
 if(!response.ok)throw new Error(result.error||`Falha na nuvem (HTTP ${response.status})`);
 return result;
}
async function checkCRMAuth(){
 const response=await fetch(API_URL+"?action=session",{method:"GET",credentials:"same-origin",headers:{"Accept":"application/json"}});
 return response.ok;
}
function showLogin(message=""){
 const gate=document.getElementById("authGate");
 gate.style.display="flex";
 const error=document.getElementById("authError");
 if(error)error.textContent=message;
 const field=document.getElementById("authPassword");
 if(field)field.focus();
}
async function startCRM(){
 document.getElementById("authGate").style.display="none";
 try{
   await openDB();
   document.documentElement.style.setProperty("--primary",state.settings.primary||"#1A8690");
   render();
 }catch(e){
   setDbStatus("Erro ao abrir armazenamento local","error");
   document.getElementById("view").innerHTML="<div class='section'><b>Não foi possível inicializar o CRM.</b><p>"+esc(e.message)+"</p><button class='btn primary' onclick='location.reload()'>Tentar novamente</button></div>";
 }
}
document.getElementById("authForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const button=document.getElementById("authSubmit"),error=document.getElementById("authError"),password=document.getElementById("authPassword").value;
 button.disabled=true;button.textContent="Validando…";error.textContent="";
 try{
   const response=await fetch(API_URL+"?action=login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({password})});
   const result=await response.json().catch(()=>({error:"Resposta inválida do servidor"}));
   if(!response.ok)throw new Error(result.error||"Não foi possível entrar.");
   document.getElementById("authPassword").value="";
   await startCRM();
 }catch(err){error.textContent=err.message||"Falha no acesso."}
 finally{button.disabled=false;button.textContent="Entrar no CRM"}
});
function normalizeState(s){
 const base={id:"state",page:"dashboard",leads:[],tasks:[],sales:[],settings:{studioName:"Studio Pâmela Pastore",primary:"#1A8690"}};
 if(!s||typeof s!=="object"||Array.isArray(s))return base;
 return {...base,...s,id:"state",leads:Array.isArray(s.leads)?s.leads:[],tasks:Array.isArray(s.tasks)?s.tasks:[],sales:Array.isArray(s.sales)?s.sales:[],settings:{...base.settings,...(s.settings&&typeof s.settings==="object"?s.settings:{})}};
}
function hasLocalBusinessData(s){return Boolean(s&&(s.leads?.length||s.tasks?.length||s.sales?.length));}
function isDefaultCloudState(s){return Boolean(s&&!s.leads?.length&&!s.tasks?.length&&!s.sales?.length);}
async function saveStore(){
 state.id="state";
 const snapshot=JSON.parse(JSON.stringify(state));
 saveQueue=saveQueue.catch(()=>{}).then(async()=>{
   await saveLocalCache(snapshot);
   try{
     if(!cloudAvailable)throw new Error("Banco remoto ainda não está disponível");
     const result=await requestCloud("PUT",{data:snapshot,revision:cloudRevision});
     cloudRevision=result.revision;cloudWarning="";
     setDbStatus("Supabase conectado • dados na nuvem","ok");
   }catch(err){
     cloudWarning="Nuvem indisponível: alterações salvas somente neste navegador. Não feche sem exportar backup.";
     setDbStatus("Nuvem indisponível • "+String(err?.message||"erro não identificado").slice(0,90),"warn");
     console.error("Falha ao persistir no Supabase:",err);
   }
 });
 return saveQueue;
}
async function loadStore(){
 await loadLocalCache();
 try{
   const result=await requestCloud("GET");
   if(!result.data||typeof result.data!=="object")throw new Error("Resposta do banco sem dados válidos");
   cloudRevision=result.revision;cloudAvailable=true;cloudWarning="";
   const cloudState=normalizeState(result.data);
   if(isDefaultCloudState(cloudState)&&hasLocalBusinessData(state)){
     // Migração inicial automática somente quando a nuvem ainda está vazia.
     const localState=JSON.parse(JSON.stringify(state));
     const saved=await requestCloud("PUT",{data:localState,revision:cloudRevision});
     cloudRevision=saved.revision;state=localState;
   }else state=cloudState;
   state=normalizeState(state);
   await saveLocalCache(state);
   setDbStatus("Supabase conectado • dados na nuvem","ok");
 }catch(err){
   cloudAvailable=false;
   cloudWarning="Nuvem indisponível: alterações salvas somente neste navegador. Não feche sem exportar backup.";
   setDbStatus("Nuvem indisponível • "+String(err?.message||"erro não identificado").slice(0,90),"warn");
   console.error("Falha ao carregar estado remoto:",err);
 }
}

 try{const rows=await parseXLSX(f);mergeRows(rows)}catch(e){document.getElementById("importMsg").innerHTML=`<span class="badge b-danger">Não foi possível ler este XLSX: ${esc(e.message)}</span>`}
}
function normalizeKey(k){return String(k||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function mapRow(r){
 let o={};
 for(const [k,v] of Object.entries(r)) o[normalizeKey(k)]=v;
 const name=o.nome||o.name||o.nomecompletodocliente||o.nomecompleto||"";
 const phoneByHeader=o.telefone||o.phone||o.whatsapp||o.celular||o.mobile||"";
 const service=o.servico||o.service||o.modalidade||"Outro";
 const source=o.origem||o.source||o.comonosconheceu||"Outro";
 const isPhoneLike=v=>{
   const d=String(v??"").replace(/\D/g,"");
   return d.length>=10 && d.length<=13;
 };
 let phone=phoneByHeader;
 const vals=Object.values(r), keys=Object.keys(r);
 if(!phone){
   const idxSource=keys.findIndex(k=>normalizeKey(k)==="comonosconheceu");
   const idxDateAula=keys.findIndex(k=>normalizeKey(k)==="datadaaula");
   if(idxSource>=0 && idxDateAula>idxSource){
     for(let i=idxSource+1;i<idxDateAula;i++){
       if(isPhoneLike(vals[i])){phone=vals[i];break}
     }
   }
 }
 if(!phone){
   const candidates=vals.filter(isPhoneLike);
   phone=candidates.find(v=>String(v).replace(/\D/g,"").length===11)||candidates[0]||"";
 }
 const foi=String(o.foinaula||"").trim().toLowerCase()==="sim";
 const fechou=String(o.fechouplano||"").trim().toLowerCase()==="sim";
 return {
   name:name||vals[2]||"",
   phone:String(phone||"").trim(),
   email:o.email||"",
   service:service||"Outro",
   source:source||"Outro",
   campaign:o.campanha||o.campaign||"",
   status:o.etapa||o.status||(fechou?"Venda realizada":foi?"Compareceu":"Novo lead"),
   temperature:o.temperatura||o.temperature||"Morno",
   appointment:foi, attended:foi, bought:fechou,
   interest:true, priceAsked:false, requestedTime:false,
   notes:o.comentarios||o.comentario||""
 };
}
function mergeRows(rows){let add=0,upd=0;rows.forEach(r=>{const x=mapRow(r);if(!x.name)return;let normalizedPhone=String(x.phone||"").replace(/\D/g,"");
 let ex=normalizedPhone ? state.leads.find(l=>String(l.phone||"").replace(/\D/g,"")===normalizedPhone) : null;
 if(!ex && x.name) ex=state.leads.find(l=>String(l.name||"").trim().toLowerCase()===String(x.name||"").trim().toLowerCase());if(ex){Object.assign(ex,x);upd++}else{state.leads.push({...x,id:id(),createdAt:new Date().toISOString(),interest:false,priceAsked:false,requestedTime:false,appointment:false,attended:false,bought:false});add++}});saveStore();document.getElementById("importMsg").innerHTML=`<span class="badge b-success">${add} importados • ${upd} atualizados • duplicados por telefone tratados</span>`;toast("Importação concluída")}
function parseCSV(txt){let lines=txt.replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const parse=l=>{let a=[],cur="",q=false;for(let i=0;i<l.length;i++){let c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===","&&!q){a.push(cur);cur=""}else cur+=c}a.push(cur);return a};let h=parse(lines[0]);return lines.slice(1).map(l=>{let a=parse(l),o={};h.forEach((k,i)=>o[k]=a[i]||"");return o})}
function u16(a,o){return a[o]|a[o+1]<<8}function u32(a,o){return (a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0}
async function unzipStore(buf){const a=new Uint8Array(buf),out={};let p=0;while(p<a.length-4){if(u32(a,p)!==0x04034b50){p++;continue}let method=u16(a,p+8),cs=u32(a,p+18),ns=u16(a,p+26),es=u16(a,p+28),name=new TextDecoder().decode(a.slice(p+30,p+30+ns)),data=a.slice(p+30+ns+es,p+30+ns+es+cs);if(method===0)out[name]=data;else if(method===8&&"DecompressionStream"in window){let ds=new DecompressionStream("deflate-raw"),ab=await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer();out[name]=new Uint8Array(ab)}else throw new Error("Navegador sem suporte a descompressão XLSX");p+=30+ns+es+cs}return out}
function xmlText(s,tag){let m=s.match(new RegExp("<"+tag+"[^>]*>([\\s\\S]*?)</"+tag+">"));return m?m[1]:""}
async function parseXLSX(file){
 const z=await unzipStore(await file.arrayBuffer()), names=Object.keys(z);
 let ss=[];
 if(z["xl/sharedStrings.xml"]){
   const raw=new TextDecoder().decode(z["xl/sharedStrings.xml"]);
   ss=[...raw.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m=>[...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join(""));
 }
 const sheetFiles=names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n));
 if(!sheetFiles.length) throw new Error("Nenhuma planilha XLSX foi encontrada.");
 function parseSheet(xml){
   const rows=[...xml.matchAll(/<row[^>]*>([\s\S]*?)<\/row>/g)].map(m=>{
     const cells=[...m[1].matchAll(/<c([^>]*)>([\s\S]*?)<\/c>/g)], o={};
     cells.forEach(c=>{
       const attrs=c[1],body=c[2],ref=(attrs.match(/r="([A-Z]+)\d+"/)||[])[1],type=(attrs.match(/t="([^"]+)"/)||[])[1];
       if(!ref)return;
       let val=xmlText(body,"v");
       if(type==="s") val=ss[Number(val)]||"";
       else if(type==="inlineStr") val=xmlText(body,"t");
       o[ref]=val;
     });
     return o;
   });
   if(!rows.length)return {score:0,data:[]};
   const colSet=[...new Set(rows.flatMap(r=>Object.keys(r)))];
   const first=rows.find(r=>Object.values(r).some(v=>String(v).trim()!==""))||rows[0];
   const headerCols=Object.keys(first).sort((a,b)=>a.localeCompare(b,(void 0),{numeric:true}));
   const headers=headerCols.map(c=>String(first[c]||"").trim());
   const keyHeaders=headers.map(normalizeKey);
   const targets=["nomecompletodocliente","nomecompleto","nome","telefone","whatsapp","modalidade","servico","comonosconheceu","origem","leadstatus","status","email","foinaula","fechouplano","datadaaula"];
   const score=keyHeaders.reduce((n,k)=>n+(targets.includes(k)?1:0),0);
   const data=rows.slice(rows.indexOf(first)+1).map(r=>{let o={};headerCols.forEach((c,i)=>{const h=headers[i]||("__blank_"+c);o[h]=r[c]||""});return o}).filter(o=>Object.values(o).some(v=>String(v).trim()!==""));
   return {score,data,headers};
 }
 let best=null;
 for(const f of sheetFiles){
   const parsed=parseSheet(new TextDecoder().decode(z[f]));
   if(!best||parsed.score>best.score)best=parsed;
 }
 if(!best||!best.data.length)throw new Error("Não encontrei uma tabela de leads reconhecível. Use uma planilha com colunas de nome e telefone.");
 return best.data;
}

function zipStore(files){const enc=new TextEncoder(),chunks=[],central=[];let offset=0;function crc32(buf){let t=crc32.table;if(!t){t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}crc32.table=t}let c=0xffffffff;for(const b of buf)c=t[(c^b)&255]^(c>>>8);return (c^0xffffffff)>>>0}
function u16b(n){return new Uint8Array([n&255,n>>>8&255])}function u32b(n){return new Uint8Array([n&255,n>>>8&255,n>>>16&255,n>>>24&255])}
for(const [name,text] of files){const nb=enc.encode(name),data=typeof text==="string"?enc.encode(text):text,crc=crc32(data),local=new Uint8Array(30+nb.length+data.length);local.set(u32b(0x04034b50),0);local.set(u16b(20),4);local.set(u16b(0),6);local.set(u16b(0),8);local.set(u16b(0),10);local.set(u16b(0),12);local.set(u32b(crc),14);local.set(u32b(data.length),18);local.set(u32b(data.length),22);local.set(u16b(nb.length),26);local.set(u16b(0),28);local.set(nb,30);local.set(data,30+nb.length);chunks.push(local);central.push({nb,crc,size:data.length,offset,name}) ;offset+=local.length}
const cd=[];let cdSize=0;for(const c of central){const h=new Uint8Array(46+c.nb.length);h.set(u32b(0x02014b50),0);h.set(u16b(20),4);h.set(u16b(20),6);h.set(u16b(0),8);h.set(u16b(0),10);h.set(u16b(0),12);h.set(u16b(0),14);h.set(u32b(c.crc),16);h.set(u32b(c.size),20);h.set(u32b(c.size),24);h.set(u16b(c.nb.length),28);h.set(u16b(0),30);h.set(u16b(0),32);h.set(u16b(0),34);h.set(u16b(0),36);h.set(u32b(0),38);h.set(u32b(c.offset),42);h.set(c.nb,46);cd.push(h);cdSize+=h.length}const end=new Uint8Array(22);end.set(u32b(0x06054b50),0);end.set(u16b(0),4);end.set(u16b(0),6);end.set(u16b(central.length),8);end.set(u16b(central.length),10);end.set(u32b(cdSize),12);end.set(u32b(offset),16);end.set(u16b(0),20);return new Blob([...chunks,...cd,[end]],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
function colName(n){let s="";n++;while(n){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}
function xlsxCell(ref,val){let v=String(val??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");return `<c r="${ref}" t="inlineStr"><is><t>${v}</t></is></c>`}
function exportXLSX(){const headers=["Nome","Telefone","Email","Serviço","Origem","Campanha","Etapa","Temperatura","Score","Criado em"];const rows=[headers,...state.leads.map(l=>[l.name,l.phone,l.email,l.service,l.source,l.campaign,l.status,l.temperature,score(l),l.createdAt])];const sheet=`<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows.map((r,i)=>`<row r="${i+1}">${r.map((x,j)=>xlsxCell(colName(j)+(i+1),x)).join("")}</row>`).join("")}</sheetData></worksheet>`;const content=`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`;const rels=`<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;const wrels=`<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`;const wb=`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Leads" sheetId="1" r:id="rId1"/></sheets></workbook>`;const blob=zipStore([["[Content_Types].xml",content],["_rels/.rels",rels],["xl/workbook.xml",wb],["xl/_rels/workbook.xml.rels",wrels],["xl/worksheets/sheet1.xml",sheet]]);downloadBlob(blob,"CRM_Studio_Pamela_Leads.xlsx")}
function exportCSV(){const h=["Nome","Telefone","Email","Serviço","Origem","Campanha","Etapa","Temperatura","Score","Criado em"];const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;const csv=[h,...state.leads.map(l=>[l.name,l.phone,l.email,l.service,l.source,l.campaign,l.status,l.temperature,score(l),l.createdAt])].map(r=>r.map(q).join(",")).join("\r\n");downloadBlob(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}),"CRM_Studio_Pamela_Leads.csv")}
